<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" ry="48" fill="url(#bgGradient)"/>
  <polygon points="256,0 256,60 196,0" fill="#ff8c00" opacity="0.15"/>
  <rect width="256" height="256" rx="48" ry="48" fill="none" stroke="#ff8c00" stroke-width="2" opacity="0.3"/>
  <text x="128" y="128" font-family="'Arial Black', sans-serif" font-size="120" font-weight="900" fill="url(#textGradient)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-8" filter="url(#glow)">IM</text>
  <line x1="60" y1="180" x2="196" y2="180" stroke="#ff8c00" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
</svg>
